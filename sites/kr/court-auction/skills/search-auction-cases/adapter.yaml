schema_version: 1

site:
  id: kr-court-auction
  name: 대한민국 법원경매
  country: KR
  locale: ko-KR
  base_url: https://example.invalid
  access: public

maintenance:
  status: experimental
  last_verified: 2026-07-12
  verification_mode: fixture-only
  known_limits:
    - Live endpoint and request parameters are not yet verified.
    - Court code may be required to disambiguate a case number.

capabilities:
  - search_case

inputs:
  case_number:
    type: string
    pattern: '^(?<year>\\d{4})(?<case_type>타경)(?<serial>\\d+)$'
  court_code:
    type: string
    required: false

operations:
  search_case:
    status: unverified
    request:
      method: POST
      path: /__unverified__/search
      encoding: form
    response:
      format: html
      parser: search-result

parsers:
  search-result:
    status: unverified
    rows:
      selector: table.__unverified__ tbody tr

limits:
  concurrency: 1
  requests_per_second: 1
  timeout_seconds: 30
  retries: 1

errors:
  challenge_patterns:
    - captcha
    - verify you are human
    - access denied
  map:
    403: forbidden
    429: rate_limited
