schema_version: 1

site:
  id: kr-court-auction
  name: 대한민국 법원경매
  country: KR
  locale: ko-KR
  base_url: https://example.invalid
  allowed_hosts:
    - example.invalid
  access: public

maintenance:
  status: experimental
  last_verified: 2026-07-12
  verification_mode: design-only
  owners: []
  known_limits:
    - Live endpoints, request parameters, and selectors are not verified.
    - Personally identifying fields must be redacted from fixtures.

session:
  cookies:
    persist: true

limits:
  concurrency: 1
  requests_per_second: 1
  timeout_seconds: 30
  retries: 1

errors:
  challenge_patterns:
    - captcha
    - verify you are human
    - access denied
  status_map:
    403: forbidden
    429: rate_limited
